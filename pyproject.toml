[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-options-lab"
version = "0.1.0"
description = "Research, backtesting and execution for NIFTY index options: NSE data pipeline, cost-aware backtests, walk-forward validation and an Upstox execution layer"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mahavir Bhattacharya" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyarrow>=17",
    "duckdb>=1.1",
    "requests>=2.32",
    "pyyaml>=6",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-requests", "types-PyYAML", "pre-commit>=3.7"]

[project.scripts]
optlab = "optlab.cli:app"

[project.urls]
Repository = "https://github.com/mahav235-svg/nifty-options-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4"]
ignore = ["RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["optlab"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["data: needs the built data layers (skipped otherwise)"]
